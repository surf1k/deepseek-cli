name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: deepseek
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin: deepseek
            archive: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            bin: deepseek
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: deepseek
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: deepseek.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package artifacts
        shell: bash
        run: |
          ARCHIVE_NAME="deepseek-${{ matrix.target }}"
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin }}"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${ARCHIVE_NAME}.zip" "${BIN_PATH}" LICENSE README.md DEEPSEEK.md
            echo "ASSET=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"
            echo "ASSET=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET }}
