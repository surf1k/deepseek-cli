[package]
name = "deepseek-cli"
version = "0.1.0"
edition = "2021"
authors = ["surf1k"]
description = "Blazing-fast terminal client and CLI for DeepSeek V3 & R1 reasoning models written in Rust"
license = "MIT"
repository = "https://github.com/surf1k/deepseek-cli"
keywords = ["deepseek", "cli", "ai", "terminal", "llm"]
categories = ["command-line-utilities"]

[[bin]]
name = "deepseek"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
rustyline = "14.0"
directories = "5.0"
toml = "0.8"
indicatif = "0.17"
anyhow = "1.0"
termimad = "0.35.5"
arboard = "3.7.0"
glob = "0.3.4"
base64 = "0.23.1"
